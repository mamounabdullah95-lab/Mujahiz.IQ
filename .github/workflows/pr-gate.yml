name: PR gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_PUBLIC_SITE_URL: "https://ci.example.test"
      VITE_FIREBASE_API_KEY: "AIzaCI_ONLY_NOT_A_SECRET_1234567890"
      VITE_FIREBASE_AUTH_DOMAIN: "demo-mujahiziq-ci.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "demo-mujahiziq-ci"
      VITE_FIREBASE_STORAGE_BUCKET: "demo-mujahiziq-ci.appspot.com"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      VITE_FIREBASE_APP_ID: "1:000000000000:web:0000000000000000"
      VITE_FIREBASE_AI_ENABLED: "false"
      VITE_FIREBASE_APP_CHECK_SITE_KEY: ""
      VITE_FORCE_DEMO: "false"
      VITE_FILE_UPLOADS_ENABLED: "false"
      VITE_SUPPLIER_EXCEL_IMPORT_ENABLED: "true"
      VITE_SUPPLIER_PROFILE_CLAIM_ENABLED: "false"
      CLAIM_SUPPLIER_PROFILE_ENABLED: "true"
      VITE_USE_FIREBASE_EMULATORS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      - name: Run repository tests
        run: npm test

      - name: TypeScript and production build
        run: npm run build

      - name: Type-check Functions
        run: npm run typecheck:functions

      - name: Validate built Firebase fail-closed bundles
        run: npm run test:firebase-bundles

      - name: Run Firestore Emulator tests
        run: npm run test:firestore-emulator

      - name: Run Functions Emulator tests
        run: npm run test:functions-emulator

      - name: Regenerate supplier template
        run: npm run generate:supplier-template

      - name: Verify generated template is unchanged
        shell: bash
        run: |
          git diff --exit-code -- public/templates/supplier-import-template.xlsx
          test "$(git hash-object public/templates/supplier-import-template.xlsx)" = "$(git rev-parse HEAD:public/templates/supplier-import-template.xlsx)"
